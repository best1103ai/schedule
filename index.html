<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f7">
<title>민준·민재 스케줄</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="민준민재">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --paper:#faf9f7; --card:#fff;
  --ink:#17181c; --soft:#5b606b; --faint:#a5a29c;
  --line:#e3e1dc; --fill:#efedea;
  --mj:#1d4ed8; --mj-bg:#eaf0ff;
  --mje:#15803d; --mje-bg:#e7f5ec;
  --now:#dc2626;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Roboto,"Noto Sans KR",sans-serif;
  font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-bottom:32px;
}
.wrap{max-width:600px;margin:0 auto;padding:0 14px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--mj);outline-offset:2px}

/* ─── header ─── */
header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:2px;padding:8px 0 6px}
.period{flex:1;font-size:21px;font-weight:800;letter-spacing:-.03em;text-align:center;min-width:0}
.nav{width:48px;height:48px;flex:none;border-radius:var(--r);display:grid;place-items:center;font-size:30px;line-height:1;color:var(--soft)}
.nav:active{background:var(--fill)}
.gear{width:48px;height:48px;flex:none;border-radius:var(--r);display:grid;place-items:center;font-size:22px;color:var(--soft)}
.rowseg{display:flex;gap:8px;padding-bottom:8px;align-items:center}
.seg{display:flex;background:var(--fill);border-radius:var(--r);padding:3px;flex:1;min-width:0}
.seg button{flex:1;padding:9px 2px;border-radius:9px;font-size:14px;font-weight:700;color:var(--soft);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.kids{display:flex;gap:6px;padding-bottom:10px}
.kid{flex:1;padding:9px 6px;border:1.5px solid var(--line);border-radius:var(--r);font-size:15px;font-weight:700;color:var(--soft);display:flex;align-items:center;justify-content:center;gap:6px}
.kid .dot{width:10px;height:10px;border-radius:50%;background:currentColor;opacity:.35}
.kid.mj .dot{color:var(--mj)} .kid.mje .dot{color:var(--mje)}
.kid[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);background:var(--card)}
.kid[aria-pressed="true"] .dot{opacity:1}

/* ─── 지금 스트립 ─── */
.nowstrip{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px}
.nowcard{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--mj);border-radius:var(--r);padding:12px 14px}
.nowcard.mje{border-left-color:var(--mje)}
.nowcard .who{font-weight:800;flex:none;font-size:16px}
.nowcard .what{min-width:0}
.nowcard .what b{font-weight:700}
.nowcard .sub{display:block;font-size:14px;color:var(--soft);margin-top:1px}

/* ─── 타임그리드 ─── */
.grid{position:relative;margin-top:14px;display:flex}
.gutter{width:48px;flex:none;position:relative}
.gutter .h{position:absolute;left:0;font-size:13px;color:var(--faint);transform:translateY(-8px);font-variant-numeric:tabular-nums}
.lanes{flex:1;position:relative;display:flex;gap:8px;min-width:0}
.lane{flex:1;position:relative;min-width:0}
.lanehead{position:sticky;top:0;text-align:center;font-size:14px;font-weight:800;padding:3px 0;color:var(--mj)}
.lanehead.mje{color:var(--mje)}
.rules{position:absolute;inset:0;pointer-events:none}
.rules i{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.blk{position:absolute;left:0;right:0;background:var(--mj-bg);border-left:4px solid var(--mj);border-radius:8px;padding:5px 7px;overflow:hidden;text-align:left}
.lane.mje .blk{background:var(--mje-bg);border-left-color:var(--mje)}
.blk .n{display:block;font-size:14px;font-weight:700;line-height:1.25;letter-spacing:-.02em}
.blk .t{display:block;font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums;line-height:1.2;margin-top:1px}
.blk.off{opacity:.55}
.blk.off .n{text-decoration:line-through}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:5}
.nowline::before{content:"";position:absolute;left:-5px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--now)}

/* ─── 2열 리스트 ─── */
.dsec{padding:16px 0;border-top:1px solid var(--line)}
.dsec:first-child{border-top:none}
.dhead{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.dhead .tag{font-size:12px;font-weight:800;background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:999px}
.dhead.sun{color:#b91c1c}
.cols{display:flex;gap:8px}
.col{flex:1;min-width:0}
.cname{font-size:13px;font-weight:800;color:var(--mj);margin-bottom:6px}
.cname.mje{color:var(--mje)}
.it{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--mj);border-radius:8px;padding:8px 9px;margin-bottom:6px;width:100%;text-align:left}
.col.mje .it{border-left-color:var(--mje)}
.it .t{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.it .n{font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.it .p{font-size:12px;color:var(--soft)}
.it.off{opacity:.6}
.it.off .n{text-decoration:line-through}
.it .tag{font-size:11px;font-weight:800;color:#b45309}
.none{color:var(--faint);font-size:14px;padding:4px 0}

/* ─── 달력 ─── */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}
.mhead{background:var(--paper);text-align:center;font-size:12px;color:var(--soft);padding:8px 0;font-weight:700}
.mcell{background:var(--card);min-height:62px;padding:6px 4px;text-align:left}
.mcell.out{background:var(--fill);color:var(--faint)}
.mcell .n{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.mcell.sun .n{color:#b91c1c}
.mcell.out .n{color:var(--faint)}
.mcell.sel{outline:2.5px solid var(--ink);outline-offset:-2px}
.mcell.now .n{background:var(--ink);color:var(--paper);border-radius:6px;padding:1px 5px}
.bars{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.bars i{height:3px;border-radius:2px;background:var(--mj)}
.bars i.mje{background:var(--mje)}
.detail{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.qm{margin-top:20px}
.qm h2{font-size:16px;margin:0 0 8px;font-weight:800}
.qgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.qcell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:8px;font-size:13px;font-variant-numeric:tabular-nums}
.qcell.out{color:#d2cfc9}
.qcell.now{background:var(--ink);color:var(--paper)}
.qdots{display:flex;gap:3px;height:5px}
.qdots i{width:5px;height:5px;border-radius:50%;background:var(--mj)}
.qdots i.mje{background:var(--mje)}
.qhead{text-align:center;font-size:11px;color:var(--soft);padding-bottom:2px}

/* ─── 알림장 ─── */
.nsearch input{width:100%;padding:13px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font:inherit;margin:12px 0}
.notice{width:100%;text-align:left;display:block;padding:15px 0;border-bottom:1px solid var(--line)}
.notice .nh{display:flex;align-items:baseline;gap:8px}
.nkid{font-size:12px;font-weight:800;color:var(--mj)}
.nkid.mje{color:var(--mje)} .nkid.both{color:var(--soft)}
.notice .nd{font-size:13px;color:var(--soft);margin-left:auto;font-variant-numeric:tabular-nums}
.notice .nt{font-weight:700;letter-spacing:-.02em}
.notice .ns{font-size:15px;color:var(--soft);margin-top:2px}
.nfull{white-space:pre-wrap;font-size:16px;line-height:1.65;margin:0 0 18px}
.nlink{display:inline-block;font-weight:800;border-bottom:2px solid var(--ink);padding-bottom:1px}

/* ─── 하단바 ─── */
.footer{display:flex;gap:8px;margin:28px auto 10px}
.footer2{margin:0 auto 12px}
/* 할일 */
.todo{display:flex;align-items:flex-start;border-bottom:1px solid var(--line);width:100%}
.todo .hit{flex:1;display:flex;gap:12px;align-items:flex-start;padding:14px 2px;text-align:left;min-width:0}
.todo .del{flex:none;width:40px;align-self:stretch;color:var(--faint);font-size:17px}
.todo .del:active{color:var(--ink)}
.todo:last-child{border-bottom:none}
.box{width:26px;height:26px;flex:none;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:15px;color:transparent;margin-top:1px}
.todo.done .box{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.todo .tx{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.35}
.todo.done .tx{text-decoration:line-through;color:var(--faint);font-weight:500}
.todo .sub2{display:block;font-size:13px;color:var(--soft);margin-top:3px}
.todo .sub2 .late{color:#b91c1c;font-weight:800}
.todo .kb{font-size:12px;font-weight:800;color:var(--mj)}
.todo .kb.mje{color:var(--mje)}
.todosum{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:12px;font-size:16px;font-weight:700}
.todosum span{color:var(--soft);font-weight:500}
.ver{text-align:center;font-size:12px;color:var(--faint);padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.btn{flex:1;padding:15px 8px;border-radius:var(--r);font-size:16px;font-weight:800;text-align:center;border:1.5px solid var(--line);background:var(--card)}
.btn.main{background:var(--ink);color:var(--paper);border-color:var(--ink);flex:1.6}
.btn:active{opacity:.8}

/* ─── 시트 ─── */
.scrim{position:fixed;inset:0;background:rgba(23,24,28,.45);z-index:30;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--paper);z-index:31;border-radius:18px 18px 0 0;max-height:90vh;overflow:auto;transform:translateY(100%);transition:transform .22s ease;padding:10px 14px calc(28px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet .in{max-width:600px;margin:0 auto}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:21px;margin:0 0 4px;letter-spacing:-.03em}
.sheet .sub{margin:0 0 16px;color:var(--soft);font-size:15px}
label{display:block;font-size:15px;font-weight:700;margin:16px 0 7px}
select,input[type=date],textarea{width:100%;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font:inherit;color:inherit}
textarea{min-height:96px;resize:vertical}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.req{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;background:var(--card)}
.req .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.req .f{font-weight:800}
.req .w{font-size:14px;color:var(--soft);font-variant-numeric:tabular-nums}
.req p{margin:6px 0 0;font-size:16px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{flex:1;padding:12px;border-radius:10px;font-size:15px;font-weight:800;border:1.5px solid var(--line);background:var(--paper)}
.acts .ok{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.st{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;margin-top:10px}
.st.wait{background:#fef3c7;color:#92400e}
.st.done{background:#dcfce7;color:#166534}
.st.no{background:var(--fill);color:var(--soft)}
.upload{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;margin-bottom:22px;background:var(--card)}
.upload h3{margin:0 0 4px;font-size:16px}
.upload p{margin:0 0 12px;font-size:14px;color:var(--soft)}
input[type=file]{width:100%;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:40px;background:var(--ink);color:var(--paper);padding:13px 20px;border-radius:999px;font-size:15px;font-weight:700;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
/* 빨간날 */
.holbar{background:#fee2e2;color:#991b1b;font-size:15px;font-weight:800;text-align:center;padding:10px;border-radius:var(--r);margin-top:14px}
.htag{font-size:12px;font-weight:800;background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:999px}
.bigcard .prev{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line);font-size:15px;color:var(--soft)}
.bigcard .prev b{font-weight:700;color:var(--ink)}

/* 지금 화면 */
.bigcard{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--mj);border-radius:14px;padding:18px;margin-bottom:12px}
.bigcard.mje{border-left-color:var(--mje)}
.bigcard .name{font-size:15px;font-weight:800;color:var(--mj)}
.bigcard.mje .name{color:var(--mje)}
.bigcard .doing{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.25;margin-top:2px}
.bigcard .when{font-size:16px;color:var(--soft);margin-top:3px;font-variant-numeric:tabular-nums}
.upnext{list-style:none;margin:12px 0 0;padding:12px 0 0;border-top:1px solid var(--line)}
.upnext li{display:flex;align-items:baseline;gap:7px;font-size:16px;padding:4px 0}
.upnext li b{font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.upnext li .p{color:var(--soft);font-size:14px}
.upnext li .d{font-size:12px;font-weight:800;color:var(--faint);flex:none;min-width:0}
.clock{text-align:center;font-size:14px;color:var(--faint);margin:14px 0 4px;font-variant-numeric:tabular-nums}

/* 지금 / 특이사항 */
.sect{font-size:13px;font-weight:800;color:var(--faint);letter-spacing:.04em;margin:18px 0 8px}
.splist{margin-top:20px}
.sp{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.sp:last-child{border-bottom:none}
.sp .when{flex:none;width:76px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sp .when.sun{color:#b91c1c}
.sp .body{min-width:0}
.sp .ttl{font-size:17px;font-weight:700;letter-spacing:-.02em}
.sp .meta{font-size:14px;color:var(--soft);margin-top:2px}
.bdg{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.bdg.cancel{background:#fee2e2;color:#991b1b}
.bdg.add{background:#dbeafe;color:#1e40af}
.bdg.change{background:#fef3c7;color:#92400e}
.who-s{font-size:13px;font-weight:800;color:var(--mj)}
.who-s.mje{color:var(--mje)}
.mcell{min-height:74px}
.mcell .n{font-size:16px}
.mdot{width:8px;height:8px;border-radius:50%;background:var(--mj);margin-top:6px}
.mdot.mje{background:var(--mje)}
.mdots{display:flex;gap:3px}
.banner{background:#fef3c7;color:#92400e;font-size:14px;padding:10px 14px;text-align:center}
</style>
</head>
<body>
<div class="banner" id="banner">일정을 불러오는 중입니다.</div>

<header>
  <div class="wrap">
    <div class="topbar">
      <button class="nav" id="prev" aria-label="이전">‹</button>
      <div class="period" id="period"></div>
      <button class="nav" id="next" aria-label="다음">›</button>
      <button class="gear" id="admin" aria-label="관리자">⚙</button>
    </div>
    <div class="rowseg">
      <div class="seg" id="seg">
        <button data-v="now" aria-pressed="true">지금</button>
        <button data-v="day" aria-pressed="false">오늘</button>
        <button data-v="tmr" aria-pressed="false">내일</button>
        <button data-v="d3" aria-pressed="false">3일</button>
        <button data-v="week" aria-pressed="false">주</button>
        <button data-v="month" aria-pressed="false">월</button>
      </div>
    </div>
    <div class="kids" id="kids">
      <button class="kid" data-k="both" aria-pressed="true">둘 다</button>
      <button class="kid mj" data-k="mj" aria-pressed="false"><span class="dot"></span>민준</button>
      <button class="kid mje" data-k="mje" aria-pressed="false"><span class="dot"></span>민재</button>
    </div>
  </div>
</header>

<main class="wrap" id="view"></main>
<div class="wrap footer">
  <button class="btn" id="toTodo">할일</button>
  <button class="btn" id="toNotice">알림장</button>
</div>
<div class="wrap footer2">
  <button class="btn main" id="reqOpen" style="width:100%">일정 변경 요청</button>
</div>
<div class="wrap"><div class="ver">v12 · 2026-09-15</div></div>



<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheetReq"><div class="in">
  <div class="grip"></div>
  <h2>일정 변경 요청</h2>
  <p class="sub">아빠가 확인한 뒤 반영합니다.</p>
  <label for="rWho">요청하는 사람</label>
  <select id="rWho">
    <option>아라</option><option>할아버지</option><option>할머니</option>
    <option>민준</option><option>민재</option><option>기타</option>
  </select>
  <div class="row2">
    <div><label for="rKid">누구 일정</label>
      <select id="rKid"><option value="mj">민준</option><option value="mje">민재</option><option value="both">둘 다</option></select></div>
    <div><label for="rDate">날짜</label><input type="date" id="rDate"></div>
  </div>
  <label for="rText">요청 내용</label>
  <textarea id="rText" placeholder="예: 태권도 빠집니다. 가족 행사가 있어요."></textarea>
  <button class="btn main" id="rSend" style="margin-top:18px;width:100%">요청 보내기</button>
</div></div>

<div class="sheet" id="sheetAdmin"><div class="in">
  <div class="grip"></div>
  <h2>요청함</h2>
  <p class="sub" id="adminSub"></p>
  <div id="reqList"></div>
</div></div>

<div class="sheet" id="sheetTodo"><div class="in">
  <div class="grip"></div>
  <h2>할일 추가</h2>
  <p class="sub">숙제, 준비물, 사인처럼 날짜보다 '해야 할 일'이 중요한 것들입니다.</p>
  <label for="tText">내용</label>
  <textarea id="tText" placeholder="예: 국어 73쪽 숙제 부모님 사인"></textarea>
  <div class="row2">
    <div><label for="tKid">누구 것</label>
      <select id="tKid"><option value="mj">민준</option><option value="mje">민재</option><option value="both">공통</option></select></div>
    <div><label for="tWho">담당</label>
      <select id="tWho"><option>누구나</option><option>민준</option><option>민재</option><option>아빠</option><option>아라</option><option>할아버지</option><option>할머니</option></select></div>
  </div>

<div class="toast" id="toast"></div>
<script>
/* ══════════════════════════════════════════
   설정
   ══════════════════════════════════════════ */
const API_URL   = "https://script.google.com/macros/s/AKfycbzZ53Pd1ZWT9bgFgAej2fNLR_fJBYu9cBb2fKh2ME_WKe_Gd06k4cNguiao4QktLbA7-Q/exec";
const ADMIN_PIN = "1103";

let DATA = {schedule:[], overrides:[], requests:[], notices:[], todos:[], holidays:[]};
let view = "now";
let anchor = new Date();
let kidMode = "both";
let sel = null, noticeQ = "", adminPin = "", prevView = "now";

const KIDS = {mj:"민준", mje:"민재"};
const DOW  = ["일","월","화","수","목","금","토"];
const $ = id => document.getElementById(id);
const viewEl = $("view");

/* ─── 날짜 ─── */
const pad = n => String(n).padStart(2,"0");
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const add = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const wStart = d => add(d, -((d.getDay()+6)%7));          // 월요일 시작
const mStart = d => new Date(d.getFullYear(), d.getMonth(), 1);
const isToday = d => fmt(d) === fmt(new Date());
const mins = t => { const [h,m]=String(t||"0:0").split(":").map(Number); return h*60+(m||0); };
const shown = () => kidMode==="both" ? ["mj","mje"] : [kidMode];

/* ─── 빨간날 ─── */
function holidayOn(d){
  const h = (DATA.holidays||[]).find(x => x.date === fmt(d));
  return h ? h.name : "";
}
const isRed = d => d.getDay() === 0 || !!holidayOn(d);

/* ─── 일정 계산 ─── */
function eventsOn(date){
  const ds = fmt(date), w = date.getDay();
  const ov = (DATA.overrides||[]).filter(o => o.date === ds);
  const list = [];
  (DATA.schedule||[]).forEach(s => {
    if(!s.dow || !s.dow.includes(w)) return;
    // 1·3주 토요일처럼 격주로 도는 일정
    if(s.weeks && s.weeks.length && !s.weeks.includes(Math.floor((date.getDate()-1)/7)+1)) return;
    if(s.from && ds < s.from) return;
    if(s.to   && ds > s.to)   return;
    const c = ov.find(o => o.targetId===s.id && o.kind==="cancel");
    const g = ov.find(o => o.targetId===s.id && o.kind==="change");
    if(c)      list.push({...s, off:true, note:c.note});
    else if(g) list.push({...s, ...clean(g), id:s.id, moved:true});
    else       list.push({...s});
  });
  ov.filter(o => o.kind==="add").forEach(o => list.push({...o, added:true}));
  // 빨간날에는 학교·방과후·대부분의 학원이 쉰다. 시트에서 '진행'으로 표시한 것만 남긴다.
  if(holidayOn(date)) return list.filter(e => e.hol || e.added)
                                 .sort((a,b) => mins(a.start) - mins(b.start));
  return list.sort((a,b) => mins(a.start) - mins(b.start));
}
function clean(o){ const r={}; Object.keys(o).forEach(k=>{ if(o[k]!=="" && o[k]!=null) r[k]=o[k]; }); delete r.date; delete r.kind; delete r.targetId; return r; }
const forKid = (list,k) => list.filter(e => e.kid === k);

/* ─── 평소와 다른 날 ─── */
function specialsOn(d){
  const ds = fmt(d);
  return (DATA.overrides||[]).filter(o => o.date === ds).map(o => {
    const base = (DATA.schedule||[]).find(s => s.id === o.targetId);
    const kid  = o.kid || (base && base.kid) || "";
    const ttl  = o.title || (base && base.title) || "일정";
    const t    = o.start ? `${o.start}${o.end? "–"+o.end : ""}` : (base ? `${base.start}–${base.end}` : "");
    return {kid, ttl, t, kind:o.kind, note:o.note||"", place:o.place||(base&&base.place)||""};
  }).filter(x => !x.kid || shown().includes(x.kid));
}
const KINDNAME = {cancel:"휴강", add:"추가", change:"변경"};

function spList(from, to, title){
  const out = [];
  for(let d = new Date(from); d <= to; d = add(d,1)){
    specialsOn(d).forEach(x => out.push({d:new Date(d), x}));
  }
  if(!out.length) return `<div class="splist"><div class="sect">${title}</div>
    <div class="none" style="padding:6px 0">평소와 같습니다.</div></div>`;
  return `<div class="splist"><div class="sect">${title}</div>` + out.map(({d,x}) => `
    <div class="sp">
      <span class="when ${d.getDay()===0?"sun":""}">${d.getMonth()+1}/${d.getDate()} ${DOW[d.getDay()]}</span>
      <span class="body">
        <span class="ttl">${x.ttl}<span class="bdg ${x.kind}">${KINDNAME[x.kind]||""}</span></span>
        <span class="meta">
          ${x.kid?`<span class="who-s ${x.kid}">${KIDS[x.kid]}</span> · `:""}${[x.t, x.place, x.note].filter(Boolean).join(" · ")}
        </span>
      </span>
    </div>`).join("") + `</div>`;
}

/* ─── 렌더 ─── */
function render(){
  const list   = view === "notices" || view === "todos";   // 목록 화면은 달력 조작이 없다
  const arrows = !list && !["now","day","tmr"].includes(view);
  $("prev").style.visibility = arrows ? "visible" : "hidden";
  $("next").style.visibility = arrows ? "visible" : "hidden";
  document.querySelector(".rowseg").style.display = list ? "none" : "flex";
  $("toNotice").textContent = view === "notices" ? "일정 보기" : "알림장";
  $("toTodo").textContent   = view === "todos"   ? "일정 보기" : "할일";
  ({now:renderNow, day:renderDay, tmr:renderDay, d3:renderD3, week:renderWeek,
    month:renderMonth, notices:renderNotices, todos:renderTodos}[view])();
}

function timeLabel(e){ return e.end ? `${e.start}–${e.end}` : e.start; }
function tagOf(e){ return e.off ? ' <span class="tag">휴강</span>' : e.added ? ' <span class="tag">추가</span>' : e.moved ? ' <span class="tag">변경</span>' : ""; }

/* ── 지금 : 큰 카드 ── */
function renderNow(){
  anchor = new Date();
  const now = new Date(), n = now.getHours()*60 + now.getMinutes();
  const ev = eventsOn(now);
  $("period").textContent = "지금";

  const hol = holidayOn(now);

  const cards = shown().map(k => {
    const list = forKid(ev,k).filter(e => !e.off && e.start);
    const cur  = list.find(e => mins(e.start) <= n && n < mins(e.end||e.start));
    const nxt  = list.find(e => mins(e.start) > n);
    const done = list.filter(e => mins(e.end||e.start) <= n).pop();   // 직전에 끝난 일정

    // 앞으로 남은 일정 3개. 오늘 것이 모자라면 내일 것으로 채운다.
    let up = list.filter(e => mins(e.start) > n).map(e => ({e, when:""}));
    if(up.length < 3){
      up = up.concat(
        forKid(eventsOn(add(now,1)), k).filter(e => !e.off && e.start)
          .map(e => ({e, when:"내일"}))
      );
    }
    up = up.slice(0,3);

    const doing = cur ? cur.title
                : list.length && !nxt ? "오늘 일정 끝"
                : list.length ? "이동 중 · 쉬는 시간"
                : hol ? `${hol} · 일정 없음` : "오늘은 일정이 없습니다";
    const when = cur ? `${timeLabel(cur)}${cur.place? " · "+cur.place : ""}` : "";
    const prev = done ? `<div class="prev"><span>직전</span> <b>${timeLabel(done)} ${done.title}</b> <span>끝남</span></div>` : "";
    const next = up.length ? `<ul class="upnext">` + up.map(({e,when}) =>
        `<li><span class="d">${when}</span><b>${e.start}</b> ${e.title}${e.place? ` <span class="p">${e.place}</span>`:""}</li>`
      ).join("") + `</ul>` : "";

    return `<div class="bigcard ${k}">
      <div class="name">${KIDS[k]}</div>
      ${prev}
      <div class="doing">${doing}</div>
      ${when?`<div class="when">${when}</div>`:""}
      ${next}</div>`;
  }).join("");

  const td = openTodos();
  const soon = td.filter(t => t.due && new Date(t.due+"T00:00:00") <= new Date(fmt(now)+"T00:00:00"));
  const sum = td.length
    ? `<button class="todosum" id="sumTodo">할일 ${td.length}건<span>${soon.length? ` · 오늘까지 ${soon.length}건` : " · 급한 건 없음"}</span></button>`
    : "";

  viewEl.innerHTML = `<div class="clock">${now.getMonth()+1}월 ${now.getDate()}일 (${DOW[now.getDay()]})${hol? " · "+hol : ""} ${pad(now.getHours())}:${pad(now.getMinutes())} 기준</div>${cards}${sum}`;
  if(td.length) $("sumTodo").onclick = () => { prevView = "now"; setView("todos"); };
}

/* ── 오늘 : 시간축 2열 (눈금은 일정의 시작·끝 시각만) ── */
function renderDay(){
  const d = anchor, ev = eventsOn(d);
  const hol = holidayOn(d);
  $("period").textContent = `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`;

  const holBar = hol ? `<div class="holbar">${hol}</div>` : "";
  const all = ev.filter(e => shown().includes(e.kid) && e.start);
  if(!all.length){
    viewEl.innerHTML = holBar + '<div class="none" style="padding:32px 0">일정이 없습니다.</div>';
    return;
  }

  // 일정의 시작·끝 시각만 눈금으로 쓴다. 긴 수업의 중간 시간은 접힌다.
  const pts = [...new Set(all.flatMap(e => [mins(e.start), mins(e.end||e.start)]))].sort((a,b)=>a-b);
  const busy = (a,b) => all.some(e => mins(e.start) <= a && mins(e.end||e.start) >= b);
  const yAt = {}; let y = 0;
  pts.forEach((p,i) => { yAt[p] = y; if(i < pts.length-1) y += busy(p, pts[i+1]) ? 58 : 26; });
  const H = y;
  const pos = m => {
    if(yAt[m] !== undefined) return yAt[m];
    for(let i=0;i<pts.length-1;i++){
      if(m >= pts[i] && m <= pts[i+1]){
        const f = (m-pts[i]) / (pts[i+1]-pts[i]);
        return yAt[pts[i]] + f*(yAt[pts[i+1]] - yAt[pts[i]]);
      }
    }
    return m < pts[0] ? 0 : H;
  };
  const hhmm = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;

  const gut   = pts.map(p => `<span class="h" style="top:${yAt[p]}px">${hhmm(p)}</span>`).join("");
  const rules = pts.map(p => `<i style="top:${yAt[p]}px"></i>`).join("");

  const lanes = shown().map(k => {
    const blocks = forKid(all,k).map(e => {
      const a = mins(e.start), b = mins(e.end||e.start);
      const top = pos(a), h = Math.max(pos(b)-top-3, 26);
      return `<button class="blk ${e.off?"off":""}" data-ev="${enc(e)}" style="top:${top}px;height:${h}px">
        <span class="n">${e.title}</span>
        <span class="t">${timeLabel(e)}</span></button>`;
    }).join("");
    return `<div class="lane ${k}">
      <div class="lanehead ${k}">${KIDS[k]}</div>
      <div style="position:relative;height:${H+8}px"><div class="rules">${rules}</div>${blocks}</div>
    </div>`;
  }).join("");

  let nl = "";
  if(isToday(d)){
    const n = new Date().getHours()*60 + new Date().getMinutes();
    if(n >= pts[0] && n <= pts[pts.length-1]) nl = `<div class="nowline" style="top:${pos(n)+26}px"></div>`;
  }

  viewEl.innerHTML = holBar + `<div class="grid">
      <div class="gutter" style="padding-top:26px"><div style="position:relative;height:${H+8}px">${gut}</div></div>
      <div class="lanes">${lanes}${nl}</div>
    </div>`;
  bindEv();
}

/* ── 3일 / 주 : 날짜별 2열 ── */
function daySection(d, showTag){
  const ev = eventsOn(d);
  const cols = shown().map(k => {
    const list = forKid(ev,k);
    return `<div class="col ${k}">
      ${shown().length>1 ? `<div class="cname ${k}">${KIDS[k]}</div>` : ""}
      ${list.length ? list.map(e => `<button class="it ${e.off?"off":""}" data-ev="${enc(e)}">
          <span class="t">${timeLabel(e)}</span>
          <div class="n">${e.title}${tagOf(e)}</div>
          ${e.place?`<span class="p">${e.place}</span>`:""}
        </button>`).join("") : '<div class="none">없음</div>'}
    </div>`;
  }).join("");
  const hol = holidayOn(d);
  const tag = showTag && isToday(d) ? '<span class="tag">오늘</span>' : "";
  const htag = hol ? `<span class="htag">${hol}</span>` : "";
  return `<section class="dsec">
    <div class="dhead ${isRed(d)?"sun":""}">${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})${tag}${htag}</div>
    <div class="cols">${cols}</div></section>`;
}

function renderD3(){
  const s = add(anchor,-1);
  $("period").textContent = `${s.getMonth()+1}월 ${s.getDate()}일 – ${add(s,2).getDate()}일`;
  viewEl.innerHTML = [0,1,2].map(i => daySection(add(s,i), true)).join("");
  bindEv();
}

function renderWeek(){
  const s = wStart(anchor), e = add(s,6);
  $("period").textContent = `${s.getMonth()+1}월 ${s.getDate()}일 – ${e.getMonth()+1}월 ${e.getDate()}일`;
  viewEl.innerHTML = [0,1,2,3,4,5,6].map(i => daySection(add(s,i), true)).join("");
  bindEv();
}

/* ── 월 ── */
function renderMonth(){
  const first = mStart(anchor);
  $("period").textContent = `${first.getFullYear()}년 ${first.getMonth()+1}월`;
  const start = wStart(first);
  let h = '<div class="mgrid">' + ["월","화","수","목","금","토","일"].map(d=>`<div class="mhead">${d}</div>`).join("");
  for(let i=0;i<42;i++){
    const d = add(start,i);
    if(i>=35 && d.getMonth()!==first.getMonth()) break;
    const out = d.getMonth()!==first.getMonth();
    const sp = out ? [] : specialsOn(d);
    const dots = [...new Set(sp.map(x=>x.kid))].map(k=>`<span class="mdot ${k==="mje"?"mje":""}"></span>`).join("");
    h += `<button class="mcell ${out?"out":""} ${!out&&isRed(d)?"sun":""} ${isToday(d)?"now":""} ${sel===fmt(d)?"sel":""}" data-d="${fmt(d)}" title="${out?"":holidayOn(d)}">
      <div class="n">${d.getDate()}</div><div class="mdots">${dots}</div></button>`;
  }
  h += "</div>";
  h += spList(first, new Date(first.getFullYear(), first.getMonth()+1, 0), `${first.getMonth()+1}월에 평소와 다른 날`);
  if(sel){
    const d = new Date(sel+"T00:00:00");
    h += `<div class="detail">${daySection(d,false)}</div>`;
  }
  viewEl.innerHTML = h;
  viewEl.querySelectorAll(".mcell").forEach(c => c.onclick = () => { sel = c.dataset.d; renderMonth(); });
  bindEv();
}

/* ── 할일 ── */
function openTodos(){ return (DATA.todos||[]).filter(t => !t.done && (t.kid==="both" || shown().includes(t.kid))); }

function dueLabel(due){
  if(!due) return "기한 없음";
  const d = new Date(due+"T00:00:00"), t = new Date(); t.setHours(0,0,0,0);
  const gap = Math.round((d-t)/86400000);
  if(gap < 0)  return `<span class="late">${-gap}일 지남</span>`;
  if(gap === 0) return "<b>오늘까지</b>";
  if(gap === 1) return "내일까지";
  return `${d.getMonth()+1}/${d.getDate()}까지`;
}

function renderTodos(){
  $("period").textContent = "할일";
  const all = (DATA.todos||[]).filter(t => t.kid==="both" || shown().includes(t.kid));
  const open = all.filter(t => !t.done);
  const done = all.filter(t => t.done);

  const key = t => t.due ? new Date(t.due+"T00:00:00").getTime() : Infinity;  // 기한 없는 건 맨 뒤로
  open.sort((a,b) => key(a)-key(b));

  const item = t => `<div class="todo ${t.done?"done":""}">
      <button class="hit" data-t="${t.id}">
        <span class="box">✓</span>
        <span>
          <span class="tx">${t.text}</span>
          <span class="sub2">${t.kid!=="both"?`<span class="kb ${t.kid}">${KIDS[t.kid]}</span> · `:""}${dueLabel(t.due)}${t.who&&t.who!=="누구나"?` · ${t.who}`:""}${t.from==="알림장"?" · 알림장":""}</span>
        </span>
      </button>
      <button class="del" data-x="${t.id}" aria-label="지우기">✕</button>
    </div>`;

  viewEl.innerHTML =
    `<button class="btn" id="todoAdd" style="width:100%;margin:14px 0 4px">할일 추가</button>`
    + (open.length ? open.map(item).join("") : '<div class="none" style="padding:24px 0">남은 할일이 없습니다.</div>')
    + (done.length ? `<div class="sect">끝낸 일 ${done.length}건</div>` + done.slice(-10).map(item).join("") : "");

  $("todoAdd").onclick = () => { $("tDue").value = ""; show("sheetTodo"); };
  viewEl.querySelectorAll("[data-t]").forEach(b => b.onclick = () => toggleTodo(b.dataset.t));
  viewEl.querySelectorAll("[data-x]").forEach(b => b.onclick = () => removeTodo(b.dataset.x));
}

async function toggleTodo(id){
  const t = (DATA.todos||[]).find(x => x.id === id); if(!t) return;
  t.done = !t.done;
  renderTodos();
  try{
    await fetch(API_URL, {method:"POST", mode:"no-cors",
      body:JSON.stringify({action:"setTodo", id, done:t.done})});
  }catch(e){ toast("저장하지 못했습니다"); }
}

async function removeTodo(id){
  const t = (DATA.todos||[]).find(x => x.id === id); if(!t) return;
  if(!confirm(`지울까요?\n\n${t.text}`)) return;
  DATA.todos = DATA.todos.filter(x => x.id !== id);
  renderTodos();
  try{
    await fetch(API_URL, {method:"POST", mode:"no-cors", body:JSON.stringify({action:"delTodo", id})});
    toast("지웠습니다");
  }catch(e){ toast("지우지 못했습니다"); }
}

/* ── 알림장 ── */
function renderNotices(){
  $("period").textContent = "알림장";
  viewEl.innerHTML = `<button class="btn" id="upOpen" style="width:100%;margin-top:14px">알림장 올리기</button>
    <div class="nsearch"><input id="nq" type="search" placeholder="알림장 검색" value="${noticeQ}"></div><div id="nlist"></div>`;
  $("upOpen").onclick = () => show("sheetUpload");
  const q = $("nq");
  q.oninput = () => { noticeQ = q.value; paintNotices(); };
  paintNotices();
}
function paintNotices(){
  const key = noticeQ.trim();
  const list = (DATA.notices||[])
    .filter(n => n.kid==="both" || shown().includes(n.kid))
    .filter(n => !key || (n.title+n.summary+n.text).includes(key));
  $("nlist").innerHTML = list.length ? list.map(n => `
    <button class="notice" data-n="${n.id}">
      <div class="nh"><span class="nkid ${n.kid}">${n.kid==="both"?"공통":KIDS[n.kid]}</span>
        <span class="nd">${String(n.ts).slice(0,10)}</span></div>
      <div class="nt">${n.title||"제목 없음"}</div>
      ${n.summary?`<div class="ns">${n.summary}</div>`:""}
    </button>`).join("")
    : `<div class="none" style="padding:24px 0">${key?"검색 결과가 없습니다.":"보관된 알림장이 없습니다."}</div>`;
  $("nlist").querySelectorAll(".notice").forEach(b => b.onclick = () => openNotice(b.dataset.n));
}
function openNotice(id){
  const n = (DATA.notices||[]).find(x => x.id === id); if(!n) return;
  $("nTitle").textContent = n.title || "알림장";
  $("nMeta").textContent = `${n.kid==="both"?"공통":KIDS[n.kid]} · ${String(n.ts).slice(0,10)}`;
  $("nText").textContent = n.text || n.summary || "";
  const a = $("nImg");
  if(n.url){ a.href = n.url; a.style.display = "inline-block"; } else a.style.display = "none";
  show("sheetNotice");
}

/* ── 일정 상세 ── */
const enc = e => encodeURIComponent(JSON.stringify({t:e.title,s:e.start,e:e.end,p:e.place,k:e.kid,y:e.type,n:e.note,o:!!e.off}));
function bindEv(){
  viewEl.querySelectorAll("[data-ev]").forEach(b => b.onclick = () => {
    const e = JSON.parse(decodeURIComponent(b.dataset.ev));
    $("dTitle").textContent = e.t;
    $("dBody").innerHTML = `<p class="sub" style="margin-bottom:0">
      ${KIDS[e.k]} · ${e.e? e.s+"–"+e.e : e.s}${e.y? " · "+e.y : ""}
      ${e.p? "<br>"+e.p : ""}${e.n? "<br>"+e.n : ""}${e.o? "<br><b>휴강</b>" : ""}</p>`;
    show("sheetDay");
  });
}

/* ─── 조작 ─── */
$("seg").onclick = e => { const b = e.target.closest("button"); if(b) setView(b.dataset.v); };
$("kids").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  kidMode = b.dataset.k;
  document.querySelectorAll("#kids .kid").forEach(x => x.setAttribute("aria-pressed", x.dataset.k===kidMode));
  render();
};
function setView(v){
  view = v;
  anchor = v === "tmr" ? add(new Date(), 1) : new Date();   // 탭을 누르면 항상 오늘 기준으로
  document.querySelectorAll("#seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v===v));
  render();
}
$("prev").onclick = () => shift(-1);
$("next").onclick = () => shift(1);
function shift(n){
  if(view==="d3")         anchor = add(anchor, 3*n);
  else if(view==="week")  anchor = add(anchor, 7*n);
  else                    anchor = new Date(anchor.getFullYear(), anchor.getMonth()+n, 1);
  render();
}
$("toNotice").onclick = () => {
  if(view === "notices") setView(prevView);
  else { prevView = view; setView("notices"); }
};
$("toTodo").onclick = () => {
  if(view === "todos") setView(prevView);
  else { prevView = view; setView("todos"); }
};

/* ─── 시트 ─── */
let openSheet = null;
function show(id){ openSheet = id; $("scrim").classList.add("on"); $(id).classList.add("on"); }
function hide(){ if(!openSheet) return; $("scrim").classList.remove("on"); $(openSheet).classList.remove("on"); openSheet = null; }
$("scrim").onclick = hide;
document.addEventListener("keydown", e => { if(e.key === "Escape") hide(); });
function toast(m){ const t = $("toast"); t.textContent = m; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"), 2800); }

/* ─── 변경 요청 ─── */
$("reqOpen").onclick = () => { $("rDate").value = fmt(new Date()); show("sheetReq"); };
$("rSend").onclick = async () => {
  const text = $("rText").value.trim();
  if(!text){ toast("요청 내용을 적어주세요"); return; }
  const req = { id:"r"+Date.now(), from:$("rWho").value, kid:$("rKid").value,
                date:$("rDate").value, text };
  try{
    await fetch(API_URL, {method:"POST", mode:"no-cors", body:JSON.stringify({action:"addRequest", req})});
    toast("요청을 보냈습니다");
    $("rText").value = ""; hide();
    if(adminPin){ await refresh(); renderRequests(); }
  }catch(e){ toast("보내지 못했습니다. 잠시 뒤 다시 시도해 주세요"); }
};

/* ─── 할일 추가 ─── */
$("tSend").onclick = async () => {
  const text = $("tText").value.trim();
  if(!text){ toast("내용을 적어주세요"); return; }
  const todo = {id:"t"+Date.now(), kid:$("tKid").value, text,
                who:$("tWho").value, due:$("tDue").value, from:"직접 입력"};
  try{
    await fetch(API_URL, {method:"POST", mode:"no-cors", body:JSON.stringify({action:"addTodo", todo})});
    $("tText").value = ""; hide();
    DATA.todos = (DATA.todos||[]).concat({...todo, done:false, from:"직접 입력"});
    render(); toast("할일을 추가했습니다");
  }catch(e){ toast("추가하지 못했습니다"); }
};

/* ─── 관리자 ─── */
$("admin").onclick = async () => {
  const pin = prompt("관리자 PIN");
  if(pin === null) return;
  if(pin !== ADMIN_PIN){ toast("PIN이 맞지 않습니다"); return; }
  adminPin = pin;
  show("sheetAdmin"); renderRequests();
  try{ await refresh(); renderRequests(); }catch(e){}
};
function renderRequests(){
  const rs = (DATA.requests||[]).slice().sort((a,b) => (a.status==="wait"?0:1)-(b.status==="wait"?0:1));
  $("adminSub").textContent = `대기 중 ${rs.filter(r=>r.status==="wait").length}건`;
  $("reqList").innerHTML = rs.length ? rs.map(r => {
    const who = r.kid==="both" ? "민준·민재" : KIDS[r.kid] || "공통";
    const badge = r.status==="wait" ? '' :
      r.status==="ok" ? '<span class="st done">반영함</span>' : '<span class="st no">반려</span>';
    return `<div class="req">
      <div class="h"><span class="f">${r.from}</span><span class="w">${r.date} · ${who}</span></div>
      <p>${r.text}</p>
      ${r.status==="wait"
        ? `<div class="acts"><button class="ok" data-ok="${r.id}">반영</button><button data-no="${r.id}">반려</button></div>`
        : badge}</div>`;
  }).join("") : '<div class="none">들어온 요청이 없습니다.</div>';
  $("reqList").querySelectorAll("[data-ok]").forEach(b => b.onclick = () => decide(b.dataset.ok,"ok"));
  $("reqList").querySelectorAll("[data-no]").forEach(b => b.onclick = () => decide(b.dataset.no,"no"));
}
async function decide(id, status){
  const r = (DATA.requests||[]).find(x => x.id === id); if(!r) return;
  r.status = status; renderRequests();
  try{ await fetch(API_URL, {method:"POST", mode:"no-cors",
        body:JSON.stringify({action:"setStatus", id, status, pin:adminPin})}); }
  catch(e){ toast("저장하지 못했습니다"); }
  toast(status==="ok" ? "반영 처리했습니다. 시간표는 시트에서 수정하세요" : "반려했습니다");
}

/* ─── 알림장 업로드 ─── */
$("uSend").onclick = async () => {
  const f = $("uFile").files[0];
  if(!f){ toast("캡처를 먼저 고르세요"); return; }
  toast("읽는 중입니다. 10초쯤 걸립니다");
  const data = await new Promise((ok,no) => {
    const r = new FileReader();
    r.onload = () => ok(r.result.split(",")[1]);
    r.onerror = no; r.readAsDataURL(f);
  });
  try{
    const before = (DATA.notices||[]).length;
    await fetch(API_URL, {method:"POST", mode:"no-cors", body:JSON.stringify({
      action:"uploadNotice", kid:$("uKid").value, mime:f.type, data })});
    $("uFile").value = ""; hide();
    await refresh();
    if(adminPin) renderRequests();
    toast((DATA.notices||[]).length > before ? "알림장을 보관했습니다" : "올렸습니다. 잠시 후 목록에 나타납니다");
  }catch(e){ toast("올리지 못했습니다"); }
};

/* ─── 데이터 ─── */
function jsonp(params){
  return new Promise((ok, fail) => {
    const cb = "cb" + Date.now() + Math.floor(Math.random()*1000);
    const tag = document.createElement("script");
    const timer = setTimeout(() => { done(); fail(new Error("timeout")); }, 30000);
    function done(){ clearTimeout(timer); delete window[cb]; tag.remove(); }
    window[cb] = d => { done(); ok(d); };
    tag.onerror = () => { done(); fail(new Error("network")); };
    tag.src = API_URL + "?" + params + "&callback=" + cb;
    document.body.appendChild(tag);
  });
}
/* 지난번 받아둔 일정을 먼저 그려서 기다리지 않게 한다 */
const CACHE_KEY = "mjmje_schedule_v1";
function saveCache(d){
  try{
    const {requests, ...rest} = d;
    localStorage.setItem(CACHE_KEY, JSON.stringify({at:Date.now(), d:rest}));
  }catch(e){}
}
function loadCache(){
  try{
    const v = localStorage.getItem(CACHE_KEY);
    if(!v) return null;
    const o = JSON.parse(v);
    return o && o.d && o.d.schedule ? o : null;
  }catch(e){ return null; }
}

async function refresh(){
  DATA = await jsonp("action=all" + (adminPin ? "&pin="+encodeURIComponent(adminPin) : ""));
  saveCache(DATA);
  render();
}

async function boot(){
  const c = loadCache();
  if(c){
    DATA = {...c.d, requests: []};
    render();
    $("banner").textContent = "최신 일정을 확인하는 중입니다.";
  }
  try{
    await refresh();
    const b = $("banner"); if(b) b.remove();
  }catch(e){
    $("banner").textContent = c
      ? "연결이 안 돼 마지막으로 받은 일정을 보여주고 있습니다."
      : "일정을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.";
    if(!c) render();
  }
  setInterval(() => { if(view==="now") renderNow(); else if(view==="day" && isToday(anchor)) renderDay(); }, 60000);
}
boot();
